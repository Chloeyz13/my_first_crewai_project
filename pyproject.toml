[project]
name = "my_first_crewai_project"
version = "0.1.0"
description = "my_first_crewai_project using crewAI"
authors = [{ name = "Yiwen Shen", email = "yiwenshenyz@gmail.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[anthropic,tools]>=1.15.30,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["agents", "crew.jsonc", "tools", "knowledge", "skills"]

[tool.crewai]
type = "crew"
definition = "crew.jsonc"
project_id = "ef99780c-f1c5-4a01-ad58-4d860e694027"
